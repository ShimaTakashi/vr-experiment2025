<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quest Pro — HDR Viewer + Google Form (Minimal, Ready)</title>
  <style>
    html, body { margin:0; height:100%; overflow:hidden; background:#000; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    #ui { position:fixed; left:12px; top:12px; display:flex; gap:8px; align-items:center; z-index:10; background:rgba(0,0,0,0.55); padding:8px 10px; border-radius:10px; backdrop-filter: blur(4px); }
    #skyUrl { width:42vw; max-width:560px; padding:8px; border-radius:8px; border:1px solid #444; background:#111; color:#eee; }
    button { padding:8px 12px; border-radius:10px; border:1px solid #333; background:#1c1c1c; color:#fff; }
    button:active { transform: translateY(1px); }
    #msg { color:#9BEF86; font-size:12px; margin-left:6px; }

    /* Google Form overlay */
    #formWrap { position:fixed; right:12px; top:12px; width:36vw; height:90vh; min-width:320px; max-width:620px; z-index:9; display:flex; flex-direction:column; }
    #formCard { flex:1; border-radius:14px; overflow:hidden; border:1px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.88); }
    #formHeader { display:flex; gap:8px; align-items:center; padding:6px 8px; }
    #formUrl { flex:1; padding:8px; border-radius:10px; border:1px solid #aaa; }
    #toggleForm { margin-left:4px; }
    iframe { width:100%; height:100%; border:0; }

    /* Hide form by default on very small screens */
    @media (max-width: 900px) { #formWrap { display:none; } }
  </style>
</head>
<body>
  <!-- Top-left control bar -->
  <div id="ui">
    <input id="skyUrl" type="text" placeholder="/assets/your_env.hdr or .exr (same-origin)" />
    <button id="applySky">Set Sky</button>
    <button id="loadDemo">Try Demo Sky</button>
    <span id="msg"></span>
  </div>

  <!-- Right-side Google Form overlay (preloaded with your URL) -->
  <div id="formWrap">
    <div id="formHeader">
      <input id="formUrl" type="text" placeholder="Paste your Google Form URL here" />
      <button id="applyForm">Load Form</button>
      <button id="toggleForm">Hide</button>
    </div>
    <div id="formCard">
      <iframe id="formFrame" src="about:blank" allow="clipboard-write; autoplay;"></iframe>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';
    import { RGBELoader } from 'https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/loaders/RGBELoader.js';
    import { EXRLoader } from 'https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/loaders/EXRLoader.js';

    // --- Basic three.js setup ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 1000);
    camera.position.set(0, 1.6, 2.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.outputColorSpace = THREE.SRGBColorSpace; // r152+
    document.body.appendChild(renderer.domElement);

    // PMREM for proper PBR environment
    const pmrem = new THREE.PMREMGenerator(renderer);
    pmrem.compileEquirectangularShader();

    // Minimal test object (so you can see something even if sky fails)
    const geo = new THREE.SphereGeometry(0.35, 48, 48);
    const mat = new THREE.MeshStandardMaterial({ metalness: 0.05, roughness: 0.2, color: 0xffffff });
    const ball = new THREE.Mesh(geo, mat); ball.position.set(0, 1.6, 0);
    scene.add(ball);

    const floor = new THREE.Mesh(new THREE.CircleGeometry(3.0, 64), new THREE.MeshStandardMaterial({ color: 0x808080, roughness: 0.9 }));
    floor.rotation.x = -Math.PI/2; floor.position.y = 0.0; scene.add(floor);

    // Soft key light (helps visibility when env not set yet)
    const light = new THREE.DirectionalLight(0xffffff, 0.6);
    light.position.set(2, 3, 1);
    scene.add(light);

    // Render loop
    const clock = new THREE.Clock();
    function animate(){
      const t = clock.getElapsedTime();
      ball.rotation.y = t * 0.25;
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    // Resize handling
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- HDR/EXR sky loading ---
    const msg = document.getElementById('msg');
    function setMessage(text, ok=true){
      msg.textContent = text;
      msg.style.color = ok ? '#9BEF86' : '#f0c674';
    }

    async function setSky(url){
      if(!url){ setMessage('Provide a .hdr or .exr URL', false); return; }
      const lower = url.toLowerCase();
      const isHDR = lower.endsWith('.hdr');
      const isEXR = lower.endsWith('.exr');
      if(!isHDR && !isEXR){ setMessage('Extension must be .hdr or .exr', false); return; }

      setMessage('Loading…');
      try {
        const loader = isHDR ? new RGBELoader() : new EXRLoader();
        loader.setDataType(THREE.FloatType);
        loader.load(url, (tex) => {
          // Prepare equirectangular background + env
          tex.mapping = THREE.EquirectangularReflectionMapping;
          // HDR/EXR are linear by nature
          tex.colorSpace = THREE.LinearSRGBColorSpace;

          const envTex = pmrem.fromEquirectangular(tex).texture;
          scene.background = tex; // retains crisp sky
          scene.environment = envTex;

          renderer.toneMappingExposure = 1.0;
          setMessage('Sky applied ✔', true);
        }, undefined, (err) => {
          console.error(err); setMessage('Failed to load sky', false);
        });
      } catch(e){
        console.error(e); setMessage('Error loading sky', false);
      }
    }

    // UI wiring for sky
    const skyUrl = document.getElementById('skyUrl');
    document.getElementById('applySky').addEventListener('click', () => setSky(skyUrl.value.trim()));

    // Demo sky path (place demo.hdr next to index.html or change this path)
    document.getElementById('loadDemo').addEventListener('click', () => {
      skyUrl.value = './demo.hdr';
      setSky(skyUrl.value);
    });

    // --- Google Form (preload with your URL) ---
    const formInput = document.getElementById('formUrl');
    const formFrame = document.getElementById('formFrame');
    const YOUR_FORM = 'https://docs.google.com/forms/d/e/1FAIpQLSd-8NTGBAGuBucwTy8xgLlW4pQ5qoeZU2NTjbhNtBFHqd6bdA/viewform?embedded=true';

    function loadForm(url){
      if(!url) return;
      const u = url.includes('viewform') ? url : (url + (url.includes('?') ? '&' : '?') + 'embedded=true');
      formFrame.src = u;
      formInput.value = u; // reflect actual loaded URL
    }

    // preload immediately
    loadForm(YOUR_FORM);

    // allow manual change
    document.getElementById('applyForm').addEventListener('click', () => loadForm(formInput.value.trim()));

    // show/hide
    const toggleBtn = document.getElementById('toggleForm');
    const formWrap = document.getElementById('formWrap');
    let hidden = false;
    toggleBtn.addEventListener('click', () => {
      hidden = !hidden;
      formWrap.style.display = hidden ? 'none' : 'flex';
      toggleBtn.textContent = hidden ? 'Show' : 'Hide';
    });
  </script>
</body>
</html>
